[workspace]
resolver = "2"
members = ["crates/controller-core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.84"
license = "GPL-3.0-or-later"
repository = "https://github.com/LucasPicoli/8B"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustix = { version = "1", features = ["event"] }
clap = { version = "4", features = ["derive"] }
serial_test = "3"
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.40", default-features = false }
kurbo = "0.13"
roxmltree = "0.21"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# Line tables keep file and line in backtraces at a fraction of full debug info's size.
[profile.dev]
debug = "line-tables-only"

# Dependencies build optimised in a debug build, so the GUI's toolkit draws at full
# speed while the workspace's own crates stay easy to debug.
[profile.dev.package."*"]
opt-level = 2
debug = false
