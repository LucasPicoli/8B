name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig-dev fonts-noto-core gettext
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: GUI_TEST_LANG=pt_BR cargo test -p gui pt_br_
      - run: GUI_TEST_LANG=qps cargo test -p gui snapshots
      - uses: taiki-e/install-action@v2
        with:
          tool: just,slint-tr-extractor@1.18.1,xtr@0.1.11
      - run: just translations-fresh
      - run: just missing-strings
